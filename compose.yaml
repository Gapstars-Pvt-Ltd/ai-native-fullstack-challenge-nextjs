services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: equipment
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: equipment
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - equipment-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment -d equipment"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  equipment-data:
