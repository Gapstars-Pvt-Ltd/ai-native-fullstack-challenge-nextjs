name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://equipment:equipment@127.0.0.1:55432/equipment
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: equipment
          POSTGRES_USER: equipment
          POSTGRES_PASSWORD: equipment
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U equipment -d equipment"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
